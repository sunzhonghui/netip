services:
  netip:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./config:/config:ro
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "/bin/netip", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

