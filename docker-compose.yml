services:
  netip:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./config:/config:ro
    cap_add:
      - NET_RAW
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/bin/netip", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "80:80/udp"
      - "443:443/udp"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-ip.ipw.3x.cx}
      - IPV4_DOMAIN=${IPV4_DOMAIN:-4.ipw.3x.cx}
      - IPV6_DOMAIN=${IPV6_DOMAIN:-6.ipw.3x.cx}
      - TEST_DOMAIN=${TEST_DOMAIN:-test.ipw.3x.cx}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - netip

volumes:
  caddy_data:
  caddy_config:
