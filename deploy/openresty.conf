# ==============================================================================
# OpenResty / Nginx 反向代理 NetIP 配置文件
# 将此文件包含或复制到您的 OpenResty / Nginx 站点配置目录中（例如 /usr/local/openresty/nginx/conf/vhost/）
# ==============================================================================

upstream netip_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. 主站 Web 界面与 REST API (双栈 IPv4 + IPv6)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ip.ipw.3x.cx; # 替换为您自己的主域名

    # SSL 证书路径（请替换为您自己的证书路径）
    # ssl_certificate /etc/letsencrypt/live/ip.ipw.3x.cx/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ip.ipw.3x.cx/privkey.pem;

    # 强制跳转 HTTPS（可选）
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://netip_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 缓冲区设置
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}

# ------------------------------------------------------------------------------
# 2. 纯 IPv4 探测域名 (仅 A 记录，切勿监听 [::])
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name 4.ipw.3x.cx; # 替换为您自己的 IPv4 探测域名

    # ssl_certificate /etc/letsencrypt/live/4.ipw.3x.cx/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/4.ipw.3x.cx/privkey.pem;

    location / {
        proxy_pass http://netip_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ------------------------------------------------------------------------------
# 3. 纯 IPv6 探测域名 (仅 AAAA 记录，切勿监听普通 IPv4 80/443)
# ------------------------------------------------------------------------------
server {
    listen [::]:80;
    listen [::]:443 ssl http2;
    server_name 6.ipw.3x.cx; # 替换为您自己的 IPv6 探测域名

    # ssl_certificate /etc/letsencrypt/live/6.ipw.3x.cx/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/6.ipw.3x.cx/privkey.pem;

    location / {
        proxy_pass http://netip_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ------------------------------------------------------------------------------
# 4. 双栈优先级探测域名 (同时配置 A 与 AAAA 记录)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.ipw.3x.cx; # 替换为您自己的双栈测试域名

    # ssl_certificate /etc/letsencrypt/live/test.ipw.3x.cx/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/test.ipw.3x.cx/privkey.pem;

    location / {
        proxy_pass http://netip_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
