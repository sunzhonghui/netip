<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="netip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="netip-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#netip-grad)" filter="url(#shadow)" />
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="26.5" fill="none" stroke="url(#netip-glow)" stroke-width="2" />

  <!-- Globe / Network Grid Lines -->
  <!-- Outer Globe Circle -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.9" />
  
  <!-- Latitude Horizontal Line -->
  <line x1="26" y1="64" x2="102" y2="64" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" />
  
  <!-- Longitude Ellipse -->
  <ellipse cx="64" cy="64" rx="20" ry="38" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.8" />
  
  <!-- Central Longitude Vertical Line -->
  <line x1="64" y1="26" x2="64" y2="102" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Network Interconnection Nodes (IP Points) -->
  <circle cx="64" cy="64" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
  <circle cx="44" cy="44" r="5.5" fill="#93c5fd" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="84" cy="44" r="5.5" fill="#93c5fd" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="44" cy="84" r="5.5" fill="#93c5fd" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="84" cy="84" r="5.5" fill="#93c5fd" stroke="#ffffff" stroke-width="2.5" />
  
  <!-- Central Pulse Indicator -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" />
</svg>
